[tool.poetry]
name = "legal_graph"
version = "0.1.0"
description = "LLM knowledge usage in graph neural network for highly accurate multi-task modular AI/ML system"
authors = [
    "Illia Savenko <savenko.ilya@lll.kpi.ua>",
    "Mykyta Bobylyow <mbobylyov@biph.kiev.ua>"
]
readme = "README.md"
packages = [{ include = "legal_graph", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
pydantic = "^2.0.0"
langchain-community = "^0.0.29"
openai = "^1.0.0"
networkx = "^3.0"
numpy = "^1.25.2"
pandas = "^2.0.3"
matplotlib = "^3.0.0"
seaborn = "0.12.2"
tqdm = "^4.66.1"
openpyxl = "^3.1.2"
nltk = "^3.8.1"
tensorboard = "^2.15.1"
jupyterlab = "^4.0.8"
ipywidgets = "^8.1.1"
jupyterlab-widgets = "^3.0.9"
torch = "2.5.1"
torch-geometric = "^2.6.1"
scipy = "^1.13.0"
tensorboardx = "^2.6.2.2"
google-cloud-bigquery = "^3.24.0"
db-dtypes = "^1.0"
pyfunctional = "^1.5.0"
jmespath = "^1.0.1"
plotly = "^6.2.0"
ipympl = "^0.9.7"



[[tool.poetry.source]]
name = "pypi"
priority = "primary"

[[tool.poetry.source]]
name = "pyg"
url = "https://data.pyg.org/whl/torch-2.5.0+cpu.html"
priority = "explicit"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"