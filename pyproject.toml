[tool.poetry]
name = "legal_graph"
version = "0.1.0"
description = "LLM knowledge usage in graph neural network for highly accurate multi-task modular AI/ML system"
authors = [
  "Illia Savenko <savenko.ilya@lll.kpi.ua>",
  "Mykyta Bobylyow <mbobylyov@biph.kiev.ua>",
]
readme = "README.md"
packages = [{ include = "legal_graph", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
pydantic = "^2.0.0"
langchain = "^0.3.27"
openai = "^1.0.0"
networkx = "^3.0"
pandas = "^2.0.3"
matplotlib = "^3.7.3"
seaborn = "^0.12.2"
tqdm = "^4.66.1"
datasets = "^2.14.6"
scipy = "^1.13.0"
langchain-community = "^0.3.27"
google-cloud-bigquery = "^3.24.0"
db-dtypes = "^1.0.0"
google-cloud-bigquery-storage = "^2.24.0"
blis = "1.0.2"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

